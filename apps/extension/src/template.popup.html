<!doctype html>
<html lang="en" class="popup scrollable scrollable-800">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.svg?v=<%= __webpack_hash__  %>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Taostats wallet for Bittensor" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <title><%= htmlWebpackPlugin.options.title || 'Taostats wallet'%></title>
    <meta name="google" content="notranslate" />
    <style>
      html,
      body {
        /* prevents bg flickering on page load */
        background: #121212;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /* Floating popup window (sign/connect fallback) and embedded toolbar popup */
      html.floating-popup,
      html.floating-popup body,
      html.embedded-popup,
      html.embedded-popup body {
        min-width: 400px;
        min-height: 600px;
      }

      html.floating-popup #root,
      html.embedded-popup #root {
        margin: 0 auto;
        width: 400px;
        height: 600px;
        overflow: hidden;
      }

      /* Chrome side panel — fill available panel width/height */
      html.side-panel,
      html.side-panel body {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      html.side-panel #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Default before surface detection (dev tab / first paint) */
      html:not(.floating-popup):not(.embedded-popup):not(.side-panel) #root {
        margin: 0 auto;
        width: 400px;
        height: 600px;
        overflow: hidden;
      }

      /* no scrollbars if screen is large enough, prevents them from appearing on windows with 125% scale where only half a pixel might be missing */
      @media screen and (min-width: 399px) and (min-height: 599px) {
        html.floating-popup,
        html.embedded-popup {
          overflow: hidden;
        }
      }
    </style>
  </head>

  <body class="notranslate">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" />
  </body>
</html>
